name = "oppsift-canadabuys-ingestion"
main = "index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

[[queues.producers]]
binding = "CANADABUYS_QUEUE"
queue = "oppsift-canadabuys"

[[queues.consumers]]
queue = "oppsift-canadabuys"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
max_concurrency = 2
dead_letter_queue = "oppsift-ingestion-dead-letter"
